<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Interfaz de SmartFitAssistant</title>
  <desc id="description">Asistente de gimnasio con perfil de usuario, consulta y cuatro técnicas de prompting ejecutadas con Ollama.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c6ff00" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#page)"/>
  <circle cx="1240" cy="170" r="360" fill="url(#limeGlow)"/>
  <circle cx="160" cy="820" r="300" fill="url(#limeGlow)" opacity=".42"/>
  <path d="M0 74H1440" stroke="#c6ff00" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(74 46)">
      <text fill="#f5f5f5" font-size="23" font-weight="800" letter-spacing="1.2">TU ASISTENTE</text>
      <text x="178" fill="#c6ff00" font-size="23" font-weight="800" letter-spacing="1.2">GYM</text>
      <g transform="translate(1132 -17)">
        <rect width="158" height="36" rx="18" fill="#c6ff00" fill-opacity=".08" stroke="#c6ff00" stroke-opacity=".3"/>
        <circle cx="20" cy="18" r="4" fill="#c6ff00"/>
        <text x="34" y="23" fill="#c6ff00" font-size="11" font-weight="700" letter-spacing="1.2">OLLAMA LOCAL</text>
      </g>
    </g>

    <g transform="translate(138 120)">
      <text fill="#c6ff00" font-size="13" font-weight="800" letter-spacing="2.5">BIENVENIDOS</text>
      <text y="67" fill="#f5f5f5" font-family="Bebas Neue, Impact, sans-serif" font-size="72" letter-spacing="1.5">ARMA TU RUTINA</text>
      <rect y="91" width="4" height="58" fill="#c6ff00"/>
      <text x="20" y="112" fill="#9e9e9e" font-size="13">Este asistente ofrece orientación general y no sustituye a un entrenador</text>
      <text x="20" y="134" fill="#9e9e9e" font-size="13">certificado o profesional de la salud.</text>
    </g>

    <g transform="translate(138 292)" filter="url(#shadow)">
      <rect width="920" height="528" rx="6" fill="#1e1e1e" stroke="#2e2e2e"/>

      <text x="34" y="48" fill="#f5f5f5" font-size="13" font-weight="800" letter-spacing="1">TU NIVEL</text>
      <rect x="34" y="63" width="410" height="54" rx="4" fill="#171717" stroke="#2e2e2e"/>
      <text x="52" y="96" fill="#9e9e9e" font-size="15">Selecciona...</text>
      <path d="M416 86l7 7 7-7" fill="none" stroke="#9e9e9e" stroke-width="2"/>

      <text x="476" y="48" fill="#f5f5f5" font-size="13" font-weight="800" letter-spacing="1">TU OBJETIVO</text>
      <rect x="476" y="63" width="410" height="54" rx="4" fill="#171717" stroke="#2e2e2e"/>
      <text x="494" y="96" fill="#9e9e9e" font-size="15">Selecciona...</text>
      <path d="M858 86l7 7 7-7" fill="none" stroke="#9e9e9e" stroke-width="2"/>

      <text x="34" y="161" fill="#f5f5f5" font-size="13" font-weight="800" letter-spacing="1">TÉCNICA DE PROMPTING</text>
      <rect x="34" y="176" width="852" height="54" rx="4" fill="#171717" stroke="#c6ff00"/>
      <text x="52" y="209" fill="#f5f5f5" font-size="15">Zero-shot</text>
      <path d="M858 199l7 7 7-7" fill="none" stroke="#c6ff00" stroke-width="2"/>

      <text x="34" y="274" fill="#f5f5f5" font-size="13" font-weight="800" letter-spacing="1">CONSULTA</text>
      <rect x="34" y="289" width="852" height="92" rx="4" fill="#171717" stroke="#2e2e2e"/>
      <text x="52" y="324" fill="#737373" font-size="15">Ej: dame una rutina de piernas para principiante...</text>

      <text x="34" y="420" fill="#f5f5f5" font-size="13" font-weight="800" letter-spacing="1">SUGERENCIAS RÁPIDAS</text>
      <g transform="translate(34 438)">
        <rect width="212" height="38" rx="19" fill="none" stroke="#3a3a3a"/>
        <text x="106" y="24" fill="#a8a8a8" font-size="12" text-anchor="middle">Soy nuevo, ¿por dónde empiezo?</text>
      </g>
      <g transform="translate(258 438)">
        <rect width="173" height="38" rx="19" fill="none" stroke="#3a3a3a"/>
        <text x="86.5" y="24" fill="#a8a8a8" font-size="12" text-anchor="middle">Tengo pena, ayúdame</text>
      </g>
      <g transform="translate(443 438)">
        <rect width="224" height="38" rx="19" fill="none" stroke="#3a3a3a"/>
        <text x="112" y="24" fill="#a8a8a8" font-size="12" text-anchor="middle">No puedo pagar un entrenador</text>
      </g>
      <g transform="translate(679 438)">
        <rect width="207" height="38" rx="19" fill="none" stroke="#3a3a3a"/>
        <text x="103.5" y="24" fill="#a8a8a8" font-size="12" text-anchor="middle">Quiero bajar de peso</text>
      </g>

      <rect x="34" y="493" width="166" height="47" rx="4" fill="#c6ff00"/>
      <text x="117" y="523" fill="#121212" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">EJECUTAR</text>
    </g>

    <g transform="translate(1090 292)">
      <text fill="#9e9e9e" font-size="12" font-weight="800" letter-spacing="2">PROMPT LAB / 04</text>
      <text y="43" fill="#f5f5f5" font-size="25" font-weight="750">Cuatro enfoques.</text>
      <text y="72" fill="#9e9e9e" font-size="14">Una misma consulta.</text>

      <g transform="translate(0 112)">
        <rect width="246" height="76" rx="5" fill="#1e1e1e" stroke="#c6ff00"/>
        <text x="18" y="29" fill="#c6ff00" font-size="11" font-weight="800">01</text>
        <text x="18" y="55" fill="#f5f5f5" font-size="17" font-weight="700">Zero-shot</text>
      </g>
      <g transform="translate(0 200)">
        <rect width="246" height="76" rx="5" fill="#1e1e1e" stroke="#2e2e2e"/>
        <text x="18" y="29" fill="#737373" font-size="11" font-weight="800">02</text>
        <text x="18" y="55" fill="#f5f5f5" font-size="17" font-weight="700">Few-shot</text>
      </g>
      <g transform="translate(0 288)">
        <rect width="246" height="76" rx="5" fill="#1e1e1e" stroke="#2e2e2e"/>
        <text x="18" y="29" fill="#737373" font-size="11" font-weight="800">03</text>
        <text x="18" y="55" fill="#f5f5f5" font-size="17" font-weight="700">Chain-of-Thought</text>
      </g>
      <g transform="translate(0 376)">
        <rect width="246" height="76" rx="5" fill="#1e1e1e" stroke="#2e2e2e"/>
        <text x="18" y="29" fill="#737373" font-size="11" font-weight="800">04</text>
        <text x="18" y="55" fill="#f5f5f5" font-size="17" font-weight="700">Role Prompting</text>
      </g>
      <g transform="translate(0 482)">
        <circle cx="7" cy="7" r="7" fill="#c6ff00"/>
        <text x="24" y="12" fill="#9e9e9e" font-size="12" letter-spacing="1">MODELO LOCAL · SESIÓN PRIVADA</text>
      </g>
    </g>
  </g>
</svg>
