<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Pantalla de acceso de Gym Mejorada</title>
  <desc id="description">Vista del sistema Fit Portal con acceso seguro, gestión de rutinas, membresías y roles.</desc>
  <defs>
    <linearGradient id="story" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26342c"/>
      <stop offset="1" stop-color="#101313"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4e86b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c4e86b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-18" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <clipPath id="peopleClip">
      <rect x="402" y="500" width="438" height="400" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1440" height="900" fill="#101313"/>
  <rect width="820" height="900" fill="url(#story)"/>
  <path d="M820 0V900" stroke="#303934"/>
  <circle cx="118" cy="84" r="310" fill="url(#glow)" opacity=".45"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="62" y="72" fill="#c4e86b" font-size="22" font-weight="800" letter-spacing="2">FIT</text>
    <text x="103" y="72" fill="#f3f5f1" fill-opacity=".42" font-size="22" font-weight="800">/</text>
    <text x="120" y="72" fill="#c4e86b" font-size="22" font-weight="800" letter-spacing="2">PORTAL</text>

    <text x="62" y="240" fill="#c4e86b" font-size="13" font-weight="800" letter-spacing="2.5">GESTIÓN Y EXPERIENCIA FITNESS</text>
    <text x="62" y="318" fill="#f3f5f1" font-size="74" font-weight="800" letter-spacing="-4">Todo tu gimnasio.</text>
    <text x="62" y="388" fill="#f3f5f1" font-size="74" font-weight="800" letter-spacing="-4">Un solo lugar.</text>
    <text x="62" y="442" fill="#c5cbc7" font-size="19">Administra clientes, rutinas, clases y membresías</text>
    <text x="62" y="472" fill="#c5cbc7" font-size="19">con una experiencia más clara para cada rol.</text>

    <g transform="translate(62 515)">
      <rect width="188" height="46" rx="23" fill="#101313" fill-opacity=".58" stroke="#c4e86b" stroke-opacity=".18"/>
      <text x="18" y="29" fill="#c4e86b" font-size="11" font-weight="800">01</text>
      <text x="50" y="29" fill="#d8ddd9" font-size="14">Rutinas organizadas</text>
    </g>
    <g transform="translate(262 515)">
      <rect width="196" height="46" rx="23" fill="#101313" fill-opacity=".58" stroke="#c4e86b" stroke-opacity=".18"/>
      <text x="18" y="29" fill="#c4e86b" font-size="11" font-weight="800">02</text>
      <text x="50" y="29" fill="#d8ddd9" font-size="14">Membresías visibles</text>
    </g>
    <g transform="translate(470 515)">
      <rect width="172" height="46" rx="23" fill="#101313" fill-opacity=".58" stroke="#c4e86b" stroke-opacity=".18"/>
      <text x="18" y="29" fill="#c4e86b" font-size="11" font-weight="800">03</text>
      <text x="50" y="29" fill="#d8ddd9" font-size="14">Gestión por roles</text>
    </g>

    <ellipse cx="650" cy="790" rx="250" ry="190" fill="url(#glow)"/>
    <path d="M470 900V730C470 635 546 565 638 565S806 635 806 730V900Z" fill="#26342c" fill-opacity=".58" stroke="#c4e86b" stroke-opacity=".16"/>
    <image href="gym-people.png" x="402" y="500" width="438" height="400" preserveAspectRatio="xMidYMax meet" filter="url(#shadow)" clip-path="url(#peopleClip)"/>
    <g transform="translate(565 834)">
      <rect width="240" height="34" rx="17" fill="#0a0e0c" fill-opacity=".78" stroke="#c4e86b" stroke-opacity=".2"/>
      <text x="120" y="22" fill="#c4e86b" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">ENTRENA · AVANZA · CONECTA</text>
    </g>

    <g transform="translate(920 186)">
      <text x="0" y="0" fill="#c4e86b" font-size="13" font-weight="800" letter-spacing="2.3">ACCESO SEGURO</text>
      <text x="0" y="76" fill="#f3f5f1" font-size="51" font-weight="780" letter-spacing="-2.2">Bienvenido</text>
      <text x="0" y="128" fill="#f3f5f1" font-size="51" font-weight="780" letter-spacing="-2.2">de nuevo</text>
      <text x="0" y="172" fill="#9ca3a0" font-size="17">Ingresa tus datos para continuar a tu panel.</text>

      <text x="0" y="239" fill="#dce1dd" font-size="14" font-weight="700">Correo electrónico</text>
      <rect x="0" y="258" width="408" height="58" rx="10" fill="#171c19" stroke="#303934"/>
      <text x="18" y="294" fill="#6f7973" font-size="16">nombre@correo.com</text>

      <text x="0" y="367" fill="#dce1dd" font-size="14" font-weight="700">Contraseña</text>
      <rect x="0" y="386" width="408" height="58" rx="10" fill="#171c19" stroke="#303934"/>
      <text x="18" y="422" fill="#6f7973" font-size="16">Tu contraseña</text>
      <text x="378" y="421" fill="#c4e86b" font-size="13" font-weight="750" text-anchor="end">Mostrar</text>

      <rect x="0" y="476" width="408" height="58" rx="10" fill="#c4e86b"/>
      <text x="191" y="512" fill="#101313" font-size="15" font-weight="800" text-anchor="middle">Iniciar sesión</text>
      <text x="279" y="512" fill="#101313" font-size="20">→</text>

      <text x="204" y="574" fill="#9ca3a0" font-size="12" text-anchor="middle">Si no puedes acceder, comunícate con la administración</text>
      <text x="204" y="594" fill="#9ca3a0" font-size="12" text-anchor="middle">del gimnasio.</text>
    </g>
  </g>
</svg>
