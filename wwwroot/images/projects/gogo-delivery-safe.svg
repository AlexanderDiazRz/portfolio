<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Pantalla inicial segura de GoGo Delivery RD</title>
  <desc id="description">Presentación inicial de la aplicación para comercios, sin información interna ni datos operativos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a1e"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#eee8df"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a55" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff5a55" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#000" flood-opacity=".58"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <circle cx="720" cy="480" r="520" fill="url(#glow)"/>
  <path d="M0 0H1440V900H0Z" fill="none" stroke="#2b2e34"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="72" fill="#a39e98" font-size="12" font-weight="700" letter-spacing="2.4">TRABAJO ACTUAL / APLICACIÓN MÓVIL</text>
    <text x="1370" y="72" fill="#a39e98" font-size="12" font-weight="700" letter-spacing="2.4" text-anchor="end">PRESENTACIÓN SEGURA</text>

    <g transform="translate(492 90)" filter="url(#shadow)">
      <rect width="456" height="744" rx="62" fill="#070809" stroke="#4a4e55" stroke-width="3"/>
      <rect x="17" y="17" width="422" height="710" rx="49" fill="url(#screen)"/>
      <rect x="166" y="26" width="124" height="19" rx="9.5" fill="#101216"/>

      <g transform="translate(68 170)">
        <circle cx="160" cy="78" r="72" fill="#ff5a55"/>
        <circle cx="160" cy="78" r="56" fill="none" stroke="#fff" stroke-opacity=".32"/>
        <path d="M132 78h56M160 50v56" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

        <text x="160" y="194" fill="#17191d" font-size="34" font-weight="850" letter-spacing="1.4" text-anchor="middle">GOGO DELIVERY RD</text>
        <text x="160" y="231" fill="#7e7770" font-size="16" font-weight="600" letter-spacing="1.8" text-anchor="middle">APP PARA COMERCIOS</text>

        <rect x="34" y="288" width="252" height="1" fill="#d9d1c8"/>
        <text x="160" y="333" fill="#4c4844" font-size="15" text-anchor="middle">Bienvenido</text>
        <text x="160" y="359" fill="#8c857e" font-size="12" text-anchor="middle">Aplicación en desarrollo</text>

        <g transform="translate(72 414)">
          <circle cx="18" cy="18" r="18" fill="#ff5a55" fill-opacity=".13"/>
          <circle cx="18" cy="18" r="5" fill="#ff5a55"/>
          <text x="49" y="23" fill="#5e5954" font-size="11" font-weight="750" letter-spacing="1.4">INICIANDO EXPERIENCIA</text>
        </g>
      </g>

      <rect x="168" y="685" width="120" height="5" rx="2.5" fill="#17191d" fill-opacity=".35"/>
    </g>

    <text x="720" y="870" fill="#8f8a84" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SIN PEDIDOS · SIN DATOS DE CLIENTES · SIN INFORMACIÓN INTERNA</text>
  </g>
</svg>
